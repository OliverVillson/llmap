name: mugge

on:
  push:
    paths: ['mugge/**', '.github/workflows/mugge.yml']
  pull_request:
    paths: ['mugge/**', '.github/workflows/mugge.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mugge
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: npm install -g typescript
      - run: bun install
      - run: bun run typecheck
      - run: bun test
      - name: spike (fake model, local sandbox)
        run: bun run spike/run-spike.ts --fake --latency 200 --flaky c-hash,py-store,ts-format --out metrics.json
      - name: bench (checker on the examples, fake model run)
        run: |
          bun bench/check.ts spike --repeats 2
          bun bench/check.ts test/fixtures/bench-mini --repeats 2
          bun bench/run.ts --bench spike --out bench-run --fake --seeds 1
      - uses: actions/upload-artifact@v4
        with:
          name: spike-metrics
          path: mugge/metrics.json

  sandbox-images:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mugge
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - name: build c, node, python and dotnet images
        run: ENGINE=docker sandbox/build.sh c node python dotnet
      - name: spike in containers (fake model)
        run: bun run spike/run-spike.ts --fake --sandbox docker --concurrency 4
